<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="/assets/images/favicon.svg"
      type="image/svg+xml"
    />
    <link rel="stylesheet" href="/assets/css/tools.css" />
    <link rel="stylesheet" href="/assets/css/styles.css" />
    <title>JSON Flattener — Anton Bondoc</title>
    <style>
      textarea {
        width: 100%;
        min-height: 200px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 1rem;
        font-family: "Fira Code", monospace;
        font-size: 0.85rem;
        color: var(--text);
        resize: vertical;
        margin-bottom: 1.5rem;
      }

      textarea:focus {
        outline: none;
        border-color: var(--accent);
      }

      .output-container {
        margin-top: 2rem;
        display: none;
      }

      .result-box {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 1rem;
        word-break: break-all;
        font-size: 0.85rem;
        position: relative;
      }

      .error-msg {
        color: var(--accent);
        font-size: 0.82rem;
        margin-top: 0.5rem;
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="header-top">
          <h1>JSON Flattener</h1>
          <nav>
            <a href="/index.html">home</a>
            <a href="/coming-soon.html">games</a>
            <a href="/tools.html" class="active">tools</a>
          </nav>
        </div>
        <p class="header-sub">
          minify and compress your json into a single line.
        </p>
      </header>

      <section>
        <p class="section-label">Input</p>
        <textarea
          id="json-input"
          placeholder="paste your bulky json here..."
        ></textarea>

        <div class="btn-group">
          <button class="btn btn-primary" onclick="flattenJson()">
            flatten
          </button>
          <button class="btn" onclick="clearAll()">clear</button>
        </div>
        <p id="error-display" class="error-msg">
          invalid json. check your syntax.
        </p>
      </section>

      <div id="output-section" class="output-container">
        <p class="section-label">Result</p>
        <div class="result-box">
          <code id="json-output"></code>
        </div>
        <button class="btn" style="margin-top: 1rem" onclick="copyResult(this)">
          copy result
        </button>
      </div>

      <div class="divider" style="margin-top: 3rem"></div>
      <a class="back-link" href="/tools.html">back to tools</a>

      <footer>built with html.</footer>
    </main>

    <script>
      function flattenJson() {
        const input = document.getElementById("json-input").value;
        const error = document.getElementById("error-display");
        const outputSection = document.getElementById("output-section");
        const outputCode = document.getElementById("json-output");

        try {
          if (!input.trim()) return;
          const parsed = JSON.parse(input);
          const flattened = JSON.stringify(parsed);

          outputCode.textContent = flattened;
          outputSection.style.display = "block";
          error.style.display = "none";
        } catch (e) {
          error.style.display = "block";
          outputSection.style.display = "none";
        }
      }

      function copyResult(btn) {
        const text = document.getElementById("json-output").textContent;

        if (!text) return;

        navigator.clipboard.writeText(text).then(() => {
          // Store original text to revert later
          const originalText = btn.textContent;

          // Change appearance
          btn.textContent = "copied!";
          btn.style.borderColor = "var(--accent)";

          // Revert after 1.5 seconds, matching the UUID generator behavior
          setTimeout(() => {
            btn.textContent = originalText;
            btn.style.borderColor = "";
          }, 1500);
        });
      }

      function clearAll() {
        document.getElementById("json-input").value = "";
        document.getElementById("output-section").style.display = "none";
        document.getElementById("error-display").style.display = "none";
      }
    </script>
  </body>
</html>
