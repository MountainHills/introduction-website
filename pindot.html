<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="./assets/images/favicon.svg"
      type="image/svg+xml"
    />
    <link href="./assets/css/styles.css" rel="stylesheet" />
    <title>you weren't supposed to find this — Anton Bondoc</title>
    <style>
      .egg-wrapper {
        padding: 4rem 0;
        display: flex;
        flex-direction: column;
      }

      .egg-label {
        font-size: 0.75rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--muted);
        margin-bottom: 1.25rem;
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }

      .egg-label::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        opacity: 0.7;
        animation: pulse 2s ease-in-out infinite;
      }

      .egg-wrapper h2 {
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.02rem;
        margin-bottom: 0.5rem;
      }

      .egg-wrapper .egg-sub {
        font-size: 0.9rem;
        color: var(--muted);
        margin-bottom: 2rem;
      }

      .egg-photo {
        width: 100%;
        max-width: 520px;
        aspect-ratio: 4 / 3;
        background-color: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 2rem;
        overflow: hidden;
      }

      .egg-photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 0.5rem;
      }

      .egg-photo .placeholder-text {
        font-size: 0.8rem;
        color: var(--muted);
        text-align: center;
        padding: 1rem;
        line-height: 1.8;
      }

      .divider {
        width: 2rem;
        height: 1px;
        background-color: var(--border);
        margin-bottom: 2.5rem;
      }

      .back-link {
        font-size: 0.85rem;
        color: var(--link);
        text-decoration: none;
      }

      .back-link:hover {
        text-decoration: underline;
      }

      .back-link::before {
        content: "← ";
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="header-top">
          <h1>Anton Oliver Bondoc</h1>
          <nav>
            <a href="index.html">home</a>
            <a href="coming-soon.html">games</a>
            <a href="coming-soon.html">tools</a>
          </nav>
        </div>
        <p class="header-sub">ahh sheet. nahuli mo ko!</p>
      </header>

      <div class="egg-wrapper">
        <p class="egg-label">secret unlocked</p>
        <h2>pindot ka nang pindot ah 🫵</h2>
        <p class="egg-sub">
          pindutin kita eh!! lumayas ka na!! baka may makita ka pang hindi mo
          dapat malaman.
        </p>

        <div class="egg-photo">
          <img
            src="./assets/images/pindot-pindot.jpg"
            alt="napaka-kulit mo ah!"
          />
        </div>

        <div class="divider"></div>
        <a class="back-link" href="index.html">back to home</a>
      </div>

      <footer>built with html.</footer>
    </main>
  </body>
</html>
